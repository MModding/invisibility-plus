import com.mmodding.gradle.api.EnvironmentTarget

plugins {
	id 'maven-publish'
	alias libs.plugins.fabric.loom
	alias libs.plugins.mmodding.gradle
}

version = "$project.mod_version+${libs.versions.minecraft.get()}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
	}
	maven {
		name = "QuiltMC"
		url = "https://maven.quiltmc.org/repository/release"
	}
}

dependencies {
	minecraft libs.minecraft
	implementation libs.fabric.loader

	implementation libs.mmodding
	implementation libs.fabric.api
}

mmodding {
	configureFabricModJson {
		name = "Invisibility Plus"
		namespace = "invisibility_plus"
		group = "com.mmodding"
		description = "Invisibility Plus is a mod that makes the next 4 levels of invisibility potions useful."
		icon = "assets/invisibility_plus/icon.png"
		license = "PolyForm-Shield-1.0.0"
		addAuthor("MModding Team")
		addContributor("FirstMegaGame4")
		withContact {
			it.homepage = "https://mmodding.com"
			it.sources = "https://github.com/MModding/invisibility-plus/issues"
			it.issues = "https://github.com/MModding/invisibility-plus"
		}
		environment = EnvironmentTarget.ANY
		withEntrypoints {
			it.init("com.mmodding.invisibility.plus.InvisibilityPlus")
		}
		addMixin("invisibility_plus.mixins.json")
		withDependencies {
			it.javaVersion = ">=" + 25
			it.minecraftVersion = "~" + libs.versions.minecraft.get()
			it.fabricLoaderVersion = ">=" + libs.versions.fabric.loader.get()
			it.fabricApiVersion = ">=" + libs.versions.fabric.api.get()
			it.mmoddingLibraryVersion = ">=" + libs.versions.mmodding.get() + "-"
		}
	}
	loomModRegistration()
}

processResources {
	inputs.property "version", version

	filesMatching('fabric.mod.json') {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}


java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}


jar {
	inputs.property "archivesName", project.name

	["LICENSE", "LICENSE.md"].each {
		from(it) {
			rename { "${it}_${project.name}"}
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
